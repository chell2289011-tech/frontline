name: Windows build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { shell: 'msys2 {0}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_ttf
      - run: |
          cmake -S . -B build -G Ninja && cmake --build build
          mkdir dist && cp build/frontline.exe dist/ && cp -r assets dist/
          ldd build/frontline.exe | grep -i mingw64 | awk '{print $3}' | xargs -I{} cp {} dist/
      - uses: actions/upload-artifact@v4
        with: { name: Frontline-Windows, path: dist }
